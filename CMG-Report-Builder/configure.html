<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Configure CMG Manifest</title><link rel="stylesheet" href="taskpane.css"></head><body><header><h1>Configure your manifest</h1></header><main><section><p>The included manifest uses a non-working example address. Enter the approved HTTPS folder address where taskpane.html and the other assets will be hosted.</p><label for="base">Hosted folder address</label><input id="base" type="url" placeholder="https://your-approved-host/cmg-report-builder"><button id="download">Download configured manifest</button><p id="result" role="status"></p></section></main><script>const template="<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<OfficeApp xmlns=\"http://schemas.microsoft.com/office/appforoffice/1.1\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xmlns:bt=\"http://schemas.microsoft.com/office/officeappbasictypes/1.0\" xsi:type=\"TaskPaneApp\">\n<Id>7d45fff2-1e8b-414c-b28b-9e93f9dc61ea</Id><Version>0.1.0.0</Version><ProviderName>CMG Report Builder</ProviderName><DefaultLocale>en-US</DefaultLocale><DisplayName DefaultValue=\"CMG Report Builder\"/><Description DefaultValue=\"Insert consistent weekly project cards and department updates.\"/><IconUrl DefaultValue=\"https://example.invalid/cmg-report-builder/assets/icon-32.png\"/><HighResolutionIconUrl DefaultValue=\"https://example.invalid/cmg-report-builder/assets/icon-80.png\"/><SupportUrl DefaultValue=\"https://example.invalid/cmg-report-builder/help.html\"/>\n<Hosts><Host Name=\"Document\"/></Hosts><Requirements><Sets DefaultMinVersion=\"1.3\"><Set Name=\"WordApi\"/></Sets></Requirements><DefaultSettings><SourceLocation DefaultValue=\"https://example.invalid/cmg-report-builder/taskpane.html\"/></DefaultSettings><Permissions>ReadWriteDocument</Permissions>\n<VersionOverrides xmlns=\"http://schemas.microsoft.com/office/taskpaneappversionoverrides\" xsi:type=\"VersionOverridesV1_0\"><Hosts><Host xsi:type=\"Document\"><DesktopFormFactor><GetStarted><Title resid=\"Start.Title\"/><Description resid=\"Start.Description\"/><LearnMoreUrl resid=\"Help.Url\"/></GetStarted><FunctionFile resid=\"Commands.Url\"/><ExtensionPoint xsi:type=\"PrimaryCommandSurface\"><CustomTab id=\"CMG.Tab\"><Group id=\"CMG.Group\"><Label resid=\"Group.Label\"/><Icon><bt:Image size=\"16\" resid=\"Icon.16\"/><bt:Image size=\"32\" resid=\"Icon.32\"/><bt:Image size=\"80\" resid=\"Icon.80\"/></Icon><Control xsi:type=\"Button\" id=\"CMG.Open\"><Label resid=\"Button.Label\"/><Supertip><Title resid=\"Button.Label\"/><Description resid=\"Button.Description\"/></Supertip><Icon><bt:Image size=\"16\" resid=\"Icon.16\"/><bt:Image size=\"32\" resid=\"Icon.32\"/><bt:Image size=\"80\" resid=\"Icon.80\"/></Icon><Action xsi:type=\"ShowTaskpane\"><TaskpaneId>CMG.Builder</TaskpaneId><SourceLocation resid=\"Taskpane.Url\"/></Action></Control></Group><Label resid=\"Tab.Label\"/></CustomTab></ExtensionPoint></DesktopFormFactor></Host></Hosts><Resources><bt:Images><bt:Image id=\"Icon.16\" DefaultValue=\"https://example.invalid/cmg-report-builder/assets/icon-16.png\"/><bt:Image id=\"Icon.32\" DefaultValue=\"https://example.invalid/cmg-report-builder/assets/icon-32.png\"/><bt:Image id=\"Icon.80\" DefaultValue=\"https://example.invalid/cmg-report-builder/assets/icon-80.png\"/></bt:Images><bt:Urls><bt:Url id=\"Help.Url\" DefaultValue=\"https://example.invalid/cmg-report-builder/help.html\"/><bt:Url id=\"Commands.Url\" DefaultValue=\"https://example.invalid/cmg-report-builder/commands.html\"/><bt:Url id=\"Taskpane.Url\" DefaultValue=\"https://example.invalid/cmg-report-builder/taskpane.html\"/></bt:Urls><bt:ShortStrings><bt:String id=\"Start.Title\" DefaultValue=\"CMG Report Builder\"/><bt:String id=\"Group.Label\" DefaultValue=\"Weekly Report\"/><bt:String id=\"Button.Label\" DefaultValue=\"Open Report Builder\"/><bt:String id=\"Tab.Label\" DefaultValue=\"CMG Project Tools\"/></bt:ShortStrings><bt:LongStrings><bt:String id=\"Start.Description\" DefaultValue=\"Create project cards and consistent weekly updates.\"/><bt:String id=\"Button.Description\" DefaultValue=\"Open the panel to add or update project cards.\"/></bt:LongStrings></Resources></VersionOverrides></OfficeApp>";document.getElementById('download').onclick=()=>{try{const raw=document.getElementById('base').value.trim().replace(/\/+$/,'');const u=new URL(raw);if(u.protocol!=='https:'||u.username||u.password||u.search||u.hash||u.hostname==='example.invalid')throw new Error('Enter a real HTTPS folder address without query parameters or a fragment.');const escape=s=>s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');const xml=template.split('https://example.invalid/cmg-report-builder').join(escape(raw));const blob=new Blob([xml],{type:'application/xml'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='manifest.xml';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);document.getElementById('result').textContent='Manifest downloaded. The web files still need to be hosted at that address.';}catch(e){document.getElementById('result').textContent=e.message;}};</script></body></html>
